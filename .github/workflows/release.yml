name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - name: Use an npm CLI with trusted-publishing support
        run: npm install --global npm@11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Detect pending changesets
        id: pending-changesets
        shell: bash
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Pending changesets detected. Create the version PR with pnpm run version."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish released packages
        if: steps.pending-changesets.outputs.found == 'false'
        uses: changesets/action@v1
        with:
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
